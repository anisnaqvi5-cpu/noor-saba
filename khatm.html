<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--parchment);color:var(--ink);font-family:'Vazirmatn',system-ui,sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}

.wrap{max-width:760px;margin:0 auto;padding:0 16px 90px}

header.top{background:var(--verdigris);color:var(--parchment);border-radius:0 0 22px 22px;padding:20px 18px;margin:0 -16px 18px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(201,162,39,.10) 0 2px,transparent 2px 14px);pointer-events:none}

.langbar button{flex:1;padding:7px 4px;font-size:.8rem;border-radius:9px;cursor:pointer;background:rgba(255,255,255,.10);color:var(--parchment);border:1px solid rgba(255,255,255,.18);font-family:inherit}
.langbar button[aria-pressed=true]{background:var(--gold);color:#2A2003;border-color:var(--gold);font-weight:700}

@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{transform:scale(.55);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes tickPulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-120px 0}100%{background-position:120px 0}}

.card{background:#fff;border:1px solid var(--parchment2);border-radius:14px;padding:16px;margin-bottom:14px;

<script>
/* ================= storage layer =================
   Local-only keys (lang, myKhatms, myClaims) stay in localStorage — they are
   per-device by design. Shared keys (khatm:*, publicKhatms) go to Supabase
   so any phone can read and write them. */
const SUPABASE_URL = 'https://megmzhnumvdqpapjnwzh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ku2MZQM1mg-md56Kb8z0dg_tt3o65Fl';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const store = {
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem('khatmapp:' + key);
      if(v === null) throw new Error('missing');
      return { key, value: v, shared };
    }
    const { data, error } = await sb.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error || !data) throw new Error('missing');
    return { key, value: data.value, shared };
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem('khatmapp:' + key, value);
      return { key, value, shared };
    }
    const { error } = await sb.from('kv_store').upsert({ key, value });
    if(error) throw error;
    return { key, value, shared };
  },
  async delete(key, shared){
    if(!shared){
      localStorage.removeItem('khatmapp:' + key);
      return { key, deleted:true, shared };
    }
    const { error } = await sb.from('kv_store').delete().eq('key', key);
    if(error) throw error;
    return { key, deleted:true, shared };
  }
};

 open:"کھولیں", remove:"فہرست سے ہٹائیں",
 joinTitle:"موجودہ ختم میں شامل ہوں", codeLabel:"ختم کا کوڈ", passLabel:"پاس ورڈ", openKhatm:"ختم کھولیں",
 joinNote:"اگر ختم پہلے بن چکا ہے تو یہی کوڈ اور پاس ورڈ باقی شرکاء اور والدین کے فون میں ڈالیں۔",

 soloHint:"ہر شریک الگ سے پورے 604 صفحات پڑھے گا۔",
 addReader:"شریک شامل کریں", namePh:"شریک کا نام", add:"شامل کریں", noMembers:"ابھی کوئی شریک نہیں۔",

 alarmLabel:"روزانہ یاد دہانی کا وقت",

 createKhatm:"ختم بنائیں",

/* -------- Jalali (Shamsi) conversion -------- */
function div(a,b){ return ~~(a/b); }
function g2j(gy, gm, gd){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 355666 + (365*gy) + div(gy2+3,4) - div(gy2+99,100) + div(gy2+399,400) + gd + gdm[gm-1];
  let jy = -1595 + 33*div(days,12053);
  days %= 12053;
  jy += 4*div(days,1461);
  days %= 1461;
  if(days > 365){ jy += div(days-1,365); days = (days-1)%365; }
  let jm, jd;
  if(days < 186){ jm = 1 + div(days,31); jd = 1 + (days%31); }
  else { jm = 7 + div(days-186,30); jd = 1 + ((days-186)%30); }
  return [jy, jm, jd];
}
function j2g(jy, jm, jd){
  jy += 1595;
  let days = -355668 + (365*jy) + div(jy,33)*8 + div((jy%33)+3,4) + jd
           + ((jm < 7) ? (jm-1)*31 : ((jm-7)*30) + 186);
  let gy = 400*div(days,146097);
  days %= 146097;
  if(days > 36524){ gy += 100*div(--days,36524); days %= 36524; if(days >= 365) days++; }
  gy += 4*div(days,1461);
  days %= 1461;
  if(days > 365){ gy += div(days-1,365); days = (days-1)%365; }
  let gd = days + 1;
  const leap = (gy%4===0 && gy%100!==0) || (gy%400===0);
  const ml = [0,31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm = 0;
  for(gm=0; gm<13 && gd > ml[gm]; gm++) gd -= ml[gm];
  return [gy, gm, gd];
}
function jIsLeap(jy){
  const g = j2g(jy,12,30);
  return g2j(g[0],g[1],g[2])[2] === 30;
}
function jMonthLen(jy, jm){
  if(jm <= 6) return 31;
  if(jm <= 11) return 30;
  return jIsLeap(jy) ? 30 : 29;
}
function gMonthLen(gy, gm){
  return new Date(gy, gm, 0).getDate();
}
const pad = n => String(n).padStart(2,'0');

/* ---- date picker (Jalali in Persian, Gregorian otherwise) ---- */
let startISO = null;

function buildDatePicker(){
  const iso = startISO || todayISO();
  const [gy,gm,gd] = iso.split('-').map(Number);
  const jalali = (lang === 'fa');
  const [y,m,d] = jalali ? g2j(gy,gm,gd) : [gy,gm,gd];
  const months = jalali ? FA_MONTHS : G_MONTHS[lang];
  const thisYear = jalali ? g2j(...todayISO().split('-').map(Number))[0]
                          : Number(todayISO().slice(0,4));

  const ySel = $('dYear'), mSel = $('dMonth'), dSel = $('dDay');
  ySel.innerHTML = '';
  for(let yy = thisYear - 1; yy <= thisYear + 3; yy++){
    ySel.insertAdjacentHTML('beforeend', `<option value="${yy}" ${yy===y?'selected':''}>${num(yy)}</option>`);
  }
  mSel.innerHTML = months.map((nm,i) =>
    `<option value="${i+1}" ${i+1===m?'selected':''}>${nm}</option>`).join('');
  fillDays(d);
}
function fillDays(keep){
  const jalali = (lang === 'fa');
  const y = +$('dYear').value, m = +$('dMonth').value;
  const len = jalali ? jMonthLen(y,m) : gMonthLen(y,m);
  const d = Math.min(keep || +$('dDay').value || 1, len);
  $('dDay').innerHTML = Array.from({length:len}, (_,i) =>
    `<option value="${i+1}" ${i+1===d?'selected':''}>${num(i+1)}</option>`).join('');
  syncStartISO();
}
function syncStartISO(){
  const y = +$('dYear').value, m = +$('dMonth').value, d = +$('dDay').value;
  const g = (lang === 'fa') ? j2g(y,m,d) : [y,m,d];
  startISO = `${g[0]}-${pad(g[1])}-${pad(g[2])}`;
  renderStartHint();
}

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  if(lang === 'fa'){
    const [jy,jm,jd] = g2j(y,m,d);
    return `${num(jd)} ${FA_MONTHS[jm-1]} ${num(jy)}`;
  }
  return new Date(iso+'T00:00').toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
}

/* -------- assignment (pages-per-day driven) -------- */
function totalDays(mode, n, perDay){
  return mode === 'shared'
    ? Math.ceil(TOTAL / (perDay * Math.max(1,n)))
    : Math.ceil(TOTAL / perDay);
}
function assignment(memberIdx, dayIdx){
  const per = state.perDay, n = state.members.length;
  const slot = state.mode === 'shared' ? (dayIdx * n + memberIdx) : dayIdx;
  const from = slot * per + 1;
  const to = Math.min(TOTAL, from + per - 1);
  return from > TOTAL ? [TOTAL+1, TOTAL] : [from, to];
}
const khatmDays = () => totalDays(state.mode, state.members.length, state.perDay);
const currentDayIdx = () => Math.max(0, Math.min(khatmDays()-1, daysBetween(state.startDate, todayISO())));
const readSet = mid => new Set(state.progress[mid] || []);
function rangeDone(mid,r){
  if(r[1] < r[0]) return true;
  const s = readSet(mid);
  for(let p=r[0];p<=r[1];p++) if(!s.has(p)) return false;
  return true;
}
const rangeLabel = r => r[1] < r[0] ? '—'
  : (r[0]===r[1] ? t('pageOne',{a:num(r[0])}) : t('pageRange',{a:num(r[0]),b:num(r[1])}));

/* ================= storage ================= */
async function save(){
  try{ await store.set('khatm:'+state.code, JSON.stringify(state), true); }
  catch(e){ toast(t('tSaved')); throw e; }
}
async function load(code){
  try{ const r = await store.get('khatm:'+code, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function saveMyList(){
  try{ await store.set('myKhatms', JSON.stringify(myKhatms), false); }catch(e){}
}
function rememberKhatm(code, title){
  myKhatms = myKhatms.filter(k => k.code !== code);
  myKhatms.unshift({ code, title });
  saveMyList();
}

/* ================= language ================= */
function applyLang(l){
  lang = l;
  document.body.dataset.lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = T[l].dir;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('.langbar button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
  $('newName').placeholder = t('namePh');
  $('khatmTitle').placeholder = t('khatmTitlePh');
  $('loading').textContent = t('loading');
  $('headTitle').textContent = state ? state.title : t('title');
  buildDatePicker(); renderModeHint(); renderMembers(); renderMyKhatms(); renderPublicList();
  $('pubName').placeholder = t('pubYourName');
  if(pubState) renderPublic();
  if(state) render();
  try{ store.set('lang', l, false); }catch(e){}
}

function renderModeHint(){

function renderLengthHint(){

  const n = Math.max(1, draft.members.length);
  const d = totalDays(draft.mode, n, per);
  $('lengthHint').textContent = draft.mode === 'shared'

}
function renderStartHint(){

}
function renderMembers(){

function addMember(){

function renderMyKhatms(){
  const box = $('myKhatmsList');
  if(!myKhatms.length){ box.innerHTML = `<p class="note">${t('noKhatms')}</p>`; return; }
  box.innerHTML = myKhatms.map((k,i)=>`
    <div class="member-chip">

      <button class="btn sm ghost" data-open="${i}">${t('open')}</button>

async function openSaved(i){
  const k = myKhatms[i];
  const s = await load(k.code);
  if(!s) return toast(t('tNotFound'));
  state = s; showMain();
}

/* ================= main render ================= */
function render(){
  const di = currentDayIdx(), days = khatmDays();
  $('headTitle').textContent = state.title;
  $('dateLabel').textContent = fmtDate(todayISO());
  $('dayLabel').textContent = t('dayOf', { a:num(di+1), b:num(days) })
    + ' — ' + t('startedOn', { d: fmtDate(state.startDate) });
  $('editPerDay').value = state.perDay;
  $('editLengthHint').textContent = state.mode === 'shared'
    ? t('lengthShared',{ n:num(state.members.length), d:num(days) })
    : t('lengthSolo',{ d:num(days) });

  $('todayList').innerHTML = state.members.map((m,i)=>{
    const r = assignment(i,di), done = rangeDone(m.id,r);
    const label = r[1] < r[0] ? t('finished') : rangeLabel(r);
    return `<div class="today-card ${done?'done':''}">
      <div class="today-info">
        <div class="today-name"><span class="dot" style="background:${m.color}"></span>${m.name}</div>
        <div class="today-range">${label}</div>
        <div class="today-meta">${done ? t('doneYes') : t('doneNo')}</div>
      </div>
      <button class="tick" data-i="${i}" aria-pressed="${done}">✓</button>
    </div>`;
  }).join('');
  $('todayList').querySelectorAll('.tick').forEach(b => b.onclick = () => toggleToday(+b.dataset.i));
  $('todayNote').textContent = state.mode === 'shared' ? t('sharedNote') : t('soloNote');

  let html = state.members.map(m=>{
    const c = (state.progress[m.id]||[]).length;
    const target = state.mode === 'shared' ? TOTAL/state.members.length : TOTAL;
    const pct = Math.min(100, Math.round(c/target*100));
    return `<div style="margin-bottom:13px">
      <div class="pline"><span><span class="dot" style="background:${m.color}"></span> ${m.name}</span>
      <span>${t('pagesN',{n:num(c)})} — ${num(pct)}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div></div>`;
  }).join('');
  const all = state.members.reduce((s,m)=>s+(state.progress[m.id]||[]).length,0);
  const grand = state.mode === 'shared' ? TOTAL : TOTAL*state.members.length;
  html += `<div class="pline" style="font-weight:700;padding-top:8px;border-top:1px solid var(--parchment2)">
    <span>${t('totalKhatm')}</span><span>${t('ofPages',{a:num(all),b:num(grand)})}</span></div>
    <div class="pbar"><i style="width:${Math.min(100,all/grand*100)}%;background:var(--gold)"></i></div>`;
  $('progressList').innerHTML = html;

  renderMushaf(di);
  $('legend').innerHTML = state.members.map(m=>`<span><span class="dot" style="background:${m.color}"></span>${m.name}</span>`).join('')
    + `<span><span class="dot" style="background:var(--parchment2)"></span>${t('unread')}</span>`;
  $('codeShow').textContent = state.code;
  if(!$('notifNote').dataset.locked) $('notifNote').textContent = t('reminderSet',{t:state.alarmTime});
}

function renderMushaf(di){
  const owner = {};
  state.members.forEach(m => (state.progress[m.id]||[]).forEach(p => owner[p] = m.color));
  const todayPages = new Set();
  state.members.forEach((m,i)=>{ const r = assignment(i,di); for(let p=r[0];p<=r[1];p++) todayPages.add(p); });

  let html = '';
  for(let j=0;j<30;j++){
    const from = JUZ_START[j], to = j===29 ? TOTAL : JUZ_START[j+1]-1;
    html += `<div class="juz-label">${t('juz',{n:num(j+1),a:num(from),b:num(to)})}</div><div class="grid">`;
    for(let p=from;p<=to;p++){
      html += `<button class="cell" data-p="${p}" aria-label="${t('page',{n:num(p)})}"
        style="background:${owner[p]||'var(--parchment2)'};${todayPages.has(p)?'outline:1.5px solid var(--rose);outline-offset:1px':''}"></button>`;
    }
    html += `</div>`;
  }
  $('mushaf').innerHTML = html;
  $('mushaf').querySelectorAll('.cell').forEach(c => c.onclick = () => togglePage(+c.dataset.p));
}

/* ================= actions ================= */
async function toggleToday(i){
  const m = state.members[i], r = assignment(i, currentDayIdx());
  if(r[1] < r[0]) return;
  const s = readSet(m.id), done = rangeDone(m.id,r);
  for(let p=r[0];p<=r[1];p++) done ? s.delete(p) : s.add(p);
  state.progress[m.id] = [...s].sort((a,b)=>a-b);
  render(); await save();
  if(!done) toast(t('tMarked',{n:m.name}));
}
async function togglePage(p){
  const di = currentDayIdx();
  let target = state.members[0];
  state.members.forEach((m,i)=>{ const r = assignment(i,di); if(p>=r[0] && p<=r[1]) target = m; });
  const owned = state.members.find(m => (state.progress[m.id]||[]).includes(p));
  if(owned) target = owned;
  const s = readSet(target.id);
  s.has(p) ? s.delete(p) : s.add(p);
  state.progress[target.id] = [...s].sort((a,b)=>a-b);
  render(); await save();
}

/* ================= reminder ================= */
function scheduleNotif(){
  if(notifTimer) clearTimeout(notifTimer);
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const [h,mi] = state.alarmTime.split(':').map(Number);
  const now = new Date(), when = new Date();
  when.setHours(h,mi,0,0);
  if(when <= now) when.setDate(when.getDate()+1);
  notifTimer = setTimeout(()=>{ new Notification(t('notifTitle'), { body: t('notifBody') }); scheduleNotif(); }, when - now);
  const n = $('notifNote'); n.dataset.locked = '1'; n.textContent = t('reminderOn',{t:state.alarmTime});
}


/* ================= public khatms ================= */
let pubIndex = [];      // [{code,title}]  shared
let pubState = null;    // currently open public khatm
let myClaimIds = [];    // local: ids of claims made on this device

/* All public khatms live in ONE shared key. Splitting the title list and the
   page records across two keys meant a half-written state could survive; this
   cannot. */
async function loadPubIndex(){
  try{
    const r = await store.get('publicKhatms', true);
    pubIndex = r ? JSON.parse(r.value) : [];
  }catch(e){ pubIndex = []; }
  pubIndex.forEach(k => { if(!Array.isArray(k.claims)) k.claims = []; });
}
async function savePubIndex(){
  await store.set('publicKhatms', JSON.stringify(pubIndex), true);   // errors bubble up
}
const findPub = code => pubIndex.find(k => k.code === code);

async function loadMyClaims(){
  try{ const r = await store.get('myClaims', false); myClaimIds = r ? JSON.parse(r.value) : []; }
  catch(e){ myClaimIds = []; }
}
async function saveMyClaims(){
  try{ await store.set('myClaims', JSON.stringify(myClaimIds), false); }catch(e){}
}

const claimedCount = k => k.claims.reduce((n,c) => n + (c.to - c.from + 1), 0);
const nextFreePage = k => claimedCount(k) + 1;

function renderPublicList(){
  const box = $('publicList');
  if(!pubIndex.length){ box.innerHTML = `<p class="note">${t('pubNone')}</p>`; return; }
  box.innerHTML = pubIndex.map((k,i) => `
    <div class="member-chip">
      <span class="name" style="font-weight:700">${k.title}</span>
      <button class="btn sm ghost" data-pub="${i}">${t('pubOpen')}</button>
    </div>`).join('');
  box.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => openPublic(pubIndex[+b.dataset.pub].code));
}

async function openPublic(code){
  await loadPubIndex();
  const k = findPub(code);
  if(!k) return toast(t('tNotFound'));
  pubState = k;
  $('setup').classList.add('hidden');
  $('main').classList.add('hidden');
  $('publicView').classList.remove('hidden');
  window.scrollTo(0,0);
  renderPublic();
}

function renderPublic(){
  const k = pubState;
  $('headTitle').textContent = k.title;
  $('pubHead').textContent = k.title;
  const taken = claimedCount(k);
  $('pubClaimedLabel').textContent = t('pubClaimed', { a: num(taken) });
  $('pubBar').style.width = Math.min(100, taken/TOTAL*100) + '%';

  // my claims
  const mine = k.claims.filter(c => myClaimIds.includes(c.id));
  $('myClaims').innerHTML = mine.length
    ? mine.map(c => `<div class="today-card ${c.done?'done':''}">
        <div class="today-info">
          <div class="today-range">${t('pageRange',{a:num(c.from),b:num(c.to)})}</div>
          <div class="today-meta">${c.done ? t('pubRead') : t('pubPending')}</div>
        </div>
        <button class="tick" data-claim="${c.id}" aria-pressed="${!!c.done}">✓</button>
      </div>`).join('')
    : `<p class="note">${t('pubNoClaim')}</p>`;
  $('myClaims').querySelectorAll('[data-claim]').forEach(b => b.onclick = () => toggleClaim(b.dataset.claim));

  // everyone
  $('pubPeople').innerHTML = k.claims.length
    ? k.claims.map(c => `<div class="member-chip">
        <span class="name">${c.name}</span>
        <span style="font-size:.82rem;color:var(--muted)">${t('pageRange',{a:num(c.from),b:num(c.to)})}</span>
        <span>${c.done ? '✓' : '…'}</span>
      </div>`).join('')
    : `<p class="note">${t('noMembers')}</p>`;

  // mushaf: green = read, gold = taken but unread
  let html = '';
  const status = {};
  k.claims.forEach(c => { for(let p=c.from;p<=c.to;p++) status[p] = c.done ? 'var(--verdigris)' : 'var(--gold)'; });
  for(let j=0;j<30;j++){
    const from = JUZ_START[j], to = j===29 ? TOTAL : JUZ_START[j+1]-1;
    html += `<div class="juz-label">${t('juz',{n:num(j+1),a:num(from),b:num(to)})}</div><div class="grid">`;
    for(let p=from;p<=to;p++)
      html += `<span class="cell" style="background:${status[p]||'var(--parchment2)'};display:block"></span>`;
    html += `</div>`;
  }
  $('pubMushaf').innerHTML = html;

  const left = TOTAL - taken;
  $('pubTakeBtn').disabled = left <= 0;
  $('pubTakeBtn').textContent = left <= 0 ? t('pubFull') : t('pubTake');
  $('pubPages').max = Math.max(1, left);
}

async function takePages(){
  const name = $('pubName').value.trim();
  if(!name) return toast(t('pubNeedName'));
  let want = Math.max(1, parseInt($('pubPages').value) || 1);

  await loadPubIndex();                    // avoid overwriting others' claims
  const k = findPub(pubState.code);
  if(!k){ renderPublicList(); return toast(t('tNotFound')); }
  pubState = k;
  const left = TOTAL - claimedCount(k);
  if(left <= 0) { renderPublic(); return toast(t('pubFull')); }
  if(want > left){ want = left; toast(t('pubTooMany',{n:num(left)})); }

  const from = nextFreePage(k), to = from + want - 1;
  const id = 'c' + Date.now() + Math.random().toString(36).slice(2,5);
  k.claims.push({ id, name, from, to, done:false });
  myClaimIds.push(id); saveMyClaims();
  try{ await savePubIndex(); }
  catch(e){ k.claims.pop(); renderPublic(); return toast(t('tSaved')); }
  renderPublic();
  toast(t('pubTaken',{a:num(from),b:num(to)}));
}

async function toggleClaim(id){
  await loadPubIndex();
  const k = findPub(pubState.code);
  if(!k) return toast(t('tNotFound'));
  pubState = k;
  const c = k.claims.find(x => x.id === id);
  if(!c) return;
  c.done = !c.done;
  try{ await savePubIndex(); }
  catch(e){ c.done = !c.done; return toast(t('tSaved')); }
  renderPublic();
}

async function createPublic(){
  const title = $('pubNewTitle').value.trim();
  if(!title) return toast(t('tNeedTitle'));
  const code = makeCode();
  await loadPubIndex();
  pubIndex.unshift({ code, title, claims: [] });
  try{ await savePubIndex(); }
  catch(e){ pubIndex.shift(); return toast(t('tSaved')); }
  $('pubNewTitle').value = '';
  renderPublicList();
  openPublic(code);
}

  $('familyGroup').classList.toggle('hidden', tab !== 'family');
  $('publicGroup').classList.toggle('hidden', tab !== 'public');
  $('setupTab').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
}

  $('publicView').classList.add('hidden');
  $('headTitle').textContent = t('title');
  $('setup').classList.remove('hidden'); $('main').classList.add('hidden');
  renderMyKhatms();
  showSetupTab(setupTab);
};
const showMain = () => { $('publicView').classList.add('hidden'); $('setup').classList.add('hidden'); $('main').classList.remove('hidden'); render(); scheduleNotif(); };

async function boot(){
  startISO = todayISO();
  let savedLang = null;
  try{ const r = await store.get('lang', false); savedLang = r && r.value; }catch(e){}
  try{ const r = await store.get('myKhatms', false); if(r) myKhatms = JSON.parse(r.value); }catch(e){}

  await loadPubIndex();
  applyLang(T[savedLang] ? savedLang : 'ur');
  $('loading').classList.add('hidden');
  showSetup();

};

$('copyBtn').onclick = () => navigator.clipboard?.writeText(state.code)
  .then(()=>toast(t('tCopied')), ()=>toast(t('tNotCopied')));
$('exitBtn').onclick = () => showSetup();

$('deleteBtn').onclick = async () => {
  if(!checkAdmin()) return;
  if(!window.confirm(t('deleteConfirm'))) return;
  await store.delete('khatm:'+state.code, true);
  myKhatms = myKhatms.filter(k => k.code !== state.code);
  saveMyList();
  toast(t('tDeleted'));
  showSetup();
};

$('notifBtn').onclick = async () => {
  const n = $('notifNote');
  if(!('Notification' in window)){ n.dataset.locked='1'; n.textContent = t('reminderUnsupported'); return; }
  const p = await Notification.requestPermission();
  if(p === 'granted') scheduleNotif();
  else { n.dataset.locked='1'; n.textContent = t('reminderNo'); }
};

async function loadAllKhatms(){
  if(!checkAdmin()) return;
  const { data, error } = await sb.from('kv_store').select('key,value').like('key','khatm:%');
  if(error){ toast(t('tSaved')); return; }
  const list = data.map(r => { try{ return JSON.parse(r.value); }catch(e){ return null; } }).filter(Boolean);
  const box = $('allKhatmsList');
  if(!list.length){ box.innerHTML = `<p class="note">${t('noneFound')}</p>`; return; }
  box.innerHTML = list.map(k => `
    <div class="member-chip">
      <span class="name" style="font-weight:700">${k.title}<br><span style="font-size:.72rem;color:var(--muted);direction:ltr;display:inline-block">${k.code}</span></span>
      <button class="btn sm ghost" data-aopen="${k.code}">${t('open')}</button>
      <button class="x" data-adel="${k.code}" title="${t('deleteKhatm')}">✕</button>
    </div>`).join('');
  box.querySelectorAll('[data-aopen]').forEach(b => b.onclick = async () => {
    const s = await load(b.dataset.aopen);
    if(!s) return toast(t('tNotFound'));
    state = s; rememberKhatm(s.code, s.title || s.code); showMain();
  });
  box.querySelectorAll('[data-adel]').forEach(b => b.onclick = async () => {
    if(!window.confirm(t('deleteConfirm'))) return;
    await store.delete('khatm:'+b.dataset.adel, true);
    myKhatms = myKhatms.filter(k => k.code !== b.dataset.adel);
    saveMyList(); renderMyKhatms();
    toast(t('tDeleted'));
    loadAllKhatms();
  });
}
$('allKhatmsBtn').onclick = loadAllKhatms;

async function openNote(){
  if(!checkAdmin()) return;
  let val = '';
  try{ const r = await store.get('note', true); val = r.value; }catch(e){}
  $('noteText').value = val;
  $('noteModal').classList.remove('hidden');
}
$('noteFab').onclick = openNote;
$('noteCloseBtn').onclick = () => $('noteModal').classList.add('hidden');
$('noteSaveBtn').onclick = async () => {
  try{ await store.set('note', $('noteText').value, true); toast(t('tNoteSaved')); }
  catch(e){ toast(t('tSaved')); }
  $('noteModal').classList.add('hidden');
};

$('pubCreateBtn').onclick = createPublic;
$('pubTakeBtn').onclick = takePages;
$('pubBack').onclick = () => { pubState = null; $('publicView').classList.add('hidden'); showSetup(); window.scrollTo(0,0); };
$('pubDeleteBtn').onclick = async () => {
  if(!checkAdmin()) return;
  if(!window.confirm(t('deleteConfirm'))) return;
  await loadPubIndex();
  pubIndex = pubIndex.filter(k => k.code !== pubState.code);
  try{ await savePubIndex(); }
  catch(e){ return toast(t('tSaved')); }
  toast(t('tDeleted'));
  pubState = null;
  $('publicView').classList.add('hidden');
  renderPublicList();
  showSetup();
};
$('pubRefresh').onclick = async () => {
  await loadPubIndex();
  const k = findPub(pubState.code);
  if(k){ pubState = k; renderPublic(); toast(t('tRefreshed')); }
};

boot();
</script>
</body>
</html>
